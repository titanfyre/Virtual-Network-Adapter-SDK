[build-system]
requires=["setuptools>=77","wheel>=0.43"]
build-backend="setuptools.build_meta"
[project]
name="virtual-network-adapter-sdk"
version="1.0.0"
description="Windows x64 Virtual-Network-Adapter-SDK direct SDK"
requires-python=">=3.10"
license="MIT"
readme="README.md"
[project.urls]
Repository="https://github.com/titanfyre/Virtual-Network-Adapter-SDK"
[tool.setuptools]
packages=["virtual_network_adapter_sdk"]
[tool.setuptools.package-data]
virtual_network_adapter_sdk=["*.dll"]
[tool.setuptools.data-files]
"share/virtual-network-adapter-sdk/docs"=["docs/*","LICENSE"]
